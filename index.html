<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Compras</title>

    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
            padding-bottom: 90px;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-radius: 0 0 25px 25px;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .total {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .total span {
            display: block;
            color: #666;
            margin-bottom: 5px;
        }

        .total strong {
            font-size: 28px;
            color: #2e7d32;
        }

        .form {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2e7d32;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .category {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
        }

        .category.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .product {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.07);
        }

        .product.checked {
            opacity: 0.55;
        }

        .product.checked .product-name {
            text-decoration: line-through;
        }

        .check {
            width: 24px;
            height: 24px;
            accent-color: #2e7d32;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .details {
            color: #777;
            font-size: 13px;
        }

        .price {
            font-weight: bold;
            color: #2e7d32;
            margin-top: 5px;
        }

        .delete {
            background: #ffebee;
            color: #c62828;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 18px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 40px 10px;
        }

        .clear-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border-radius: 10px;
            background: #fff;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .category-title {
            font-size: 18px;
            margin: 18px 0 10px;
        }

        @media (min-width: 600px) {
            .form-row {
                display: flex;
                gap: 10px;
            }

            .form-row input,
            .form-row select {
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Minha Lista</h1>
    <p>Organize suas compras por categoria</p>
</header>

<div class="container">

    <div class="total">
        <span>Total da compra</span>
        <strong id="total">R$ 0,00</strong>
    </div>

    <div class="form">

        <input
            type="text"
            id="product"
            placeholder="Nome do produto"
        >

        <div class="form-row">

            <input
                type="number"
                id="quantity"
                placeholder="Quantidade"
                min="1"
                value="1"
            >

            <input
                type="number"
                id="price"
                placeholder="Preço (R$)"
                min="0"
                step="
